<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background: rounded square, same dark tone as the dashboard theme -->
  <rect width="256" height="256" rx="56" fill="#15151E"/>

  <!-- Three bars: the "dashboard" part -->
  <rect x="58"  y="150" width="36" height="52"  rx="6" fill="#F5F5F5" opacity="0.55"/>
  <rect x="110" y="118" width="36" height="84"  rx="6" fill="#F5F5F5" opacity="0.75"/>
  <rect x="162" y="80"  width="36" height="122" rx="6" fill="#F5F5F5"/>

  <!-- Chequered flag on top of the tallest bar -->
  <g transform="translate(162 52)">
    <rect width="36" height="20" rx="3" fill="#F5F5F5"/>
    <rect x="0"  y="0"  width="9" height="10" fill="#15151E"/>
    <rect x="18" y="0"  width="9" height="10" fill="#15151E"/>
    <rect x="9"  y="10" width="9" height="10" fill="#15151E"/>
    <rect x="27" y="10" width="9" height="10" fill="#15151E"/>
  </g>

  <!-- Red racing line: the "auto" part, also reads as a trend curve -->
  <path d="M40 196 C 90 190, 120 150, 150 120 S 200 70, 222 60"
        fill="none" stroke="#E10600" stroke-width="12" stroke-linecap="round"/>
</svg>
